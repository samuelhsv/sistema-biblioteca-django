name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: n+2(pd4=ox5_5+2szp#fh)3comgt6jr12!2pofk$61u7cy+)6q
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # use a mesma versão do PythonAnywhere, SEMPRE entre aspas
      - run: pip install -r requirements.txt
      - name: Verificar configuração
        run: python manage.py check
      - name: Verificar migrações esquecidas
        run: python manage.py makemigrations --check --dry-run
      - name: Rodar testes
        run: python manage.py test